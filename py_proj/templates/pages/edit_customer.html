{% extends 'base.html' %}

{% block title %}Edit Customer{% endblock %}

{% block content %}

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Save Changes</button>
    </form>
<a href="{% url 'search_customer' %}">Search Customers</a>
<a href="{% url 'add_customer' %}">Add New Customer</a>
{% endblock %}
